# Days Gone Crafting / Resource Planner Knowledge Base
# Format: YAML
# Purpose: Give an LLM (e.g. GPT-5.6 Terra) explicit, structured data for
# recipe expansion, resource planning, GPS loot-zone ranking, and quantity math.
#
# IMPORTANT:
# - Do not infer missing recipe quantities.
# - Respect output_quantity. One craft action can create more than one item.
# - For requested quantities, batches_required = ceil(requested_quantity / output_quantity).
# - Multiply every ingredient quantity by batches_required.
# - ingredient_groups with mode: any_of mean ONE listed alternative is required, not all.
# - Base melee weapons listed as ingredients are CONSUMED by crafting.
# - Some melee recipe values conflict across public sources. See data_quality_notes.
# - Planner should normally prioritize recipes with confidence high/medium.
# - Do not treat "unlock" metadata as an ingredient requirement.

schema_version: "1.0"
game:
  title: "Days Gone"
  scope:
    - "Days Gone (original / PC)"
    - "Days Gone Remastered"
  data_focus: "crafting recipes and planner dependency expansion"

planner_rules:
  quantity_math:
    formula: "batches_required = ceil(requested_quantity / output_quantity)"
    ingredient_formula: "total_ingredient = ingredient.quantity * batches_required"
    examples:
      - request:
          recipe_id: incendiary_bolt
          quantity: 8
        output_quantity_per_batch: 3
        batches_required: 3
        resulting_requirements:
          cedar_sapling: 3
          rag: 3
          kerosene: 3
          scrap: 3
      - request:
          recipe_id: crossbow_bolt
          quantity: 12
        output_quantity_per_batch: 5
        batches_required: 3
        resulting_requirements:
          cedar_sapling: 3
          scrap: 3

  ingredient_group_rules:
    all_of:
      meaning: "Every ingredient in this list is required."
    any_of:
      meaning: "Exactly one valid alternative from the group is sufficient per batch."
      planner_behavior:
        - "Evaluate each valid alternative against known loot locations."
        - "Choose the alternative producing the best route/zone score."
        - "Do not sum all alternatives together."

  inventory_subtraction:
    enabled: true
    formula: "missing = max(0, required - inventory_owned)"
    order:
      - "Expand recipes into raw requirements."
      - "Apply batch/output quantity."
      - "Resolve alternative ingredient groups."
      - "Subtract current inventory."
      - "Send only missing resources to GPS optimizer."

  recipe_combination:
    enabled: true
    behavior:
      - "Multiple requested recipes may share ingredients."
      - "Expand each request."
      - "Sum identical normalized ingredient IDs."
      - "Then subtract current inventory."
    example:
      request:
        molotov: 5
        incendiary_bolt: 8
      normalized_total_before_inventory:
        beer_bottle: 5
        rag: 8
        kerosene: 8
        cedar_sapling: 3
        scrap: 3

  confidence_policy:
    high: "Safe to use automatically in planner."
    medium: "Usable, but retain provenance/verification note."
    disputed: "Do not silently assume a single canonical value. Prefer in-game verification or version-specific configuration."


data_quality_notes:
  - id: melee_scrap_cost_conflict
    severity: high
    description: >
      Established original-game sources and current map/wiki-style references
      usually list 1 Scrap for Spiked Bat, Bat Axe, Superior Club, and the
      corresponding early improvised melee variants. Some 2025 Remastered
      recipe guides instead list 3 Scrap for spiked variants and 5 Scrap for
      axe/club variants. No strong primary-source confirmation of a Remastered
      balance change was found. Keep these values version-configurable.
    recommended_project_behavior:
      - "Default classic/original data to the 1-Scrap values."
      - "Do not assume the 3/5-Scrap Remastered values are correct without in-game verification."
      - "Allow a future data override by game version."

  - id: ripper_club_component_conflict
    severity: medium
    description: >
      Multiple established guides list Wooden Baseball Bat + Small Pipe + 5 Scrap.
      One Days Gone Wiki entry lists Wooden Baseball Bat + Box of Nails + 5 Scrap.
    recommended_project_behavior:
      - "Use Small Pipe provisionally."
      - "Mark recipe as verification-needed."

  - id: explosive_bolt_batch_yield
    severity: medium
    description: >
      Community/gameplay sources report 3 Explosive Bolts per Gun Powder/crafting

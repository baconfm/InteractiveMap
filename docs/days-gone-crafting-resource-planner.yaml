recommended_project_typescript_shape: |
  type Ingredient = {
    itemId: string;
    quantity: number;
    consumed?: boolean;
  };

  type AlternativeIngredientGroup = {
    groupId: string;
    quantityRequired: number;
    alternatives: Ingredient[];
  };

  type Recipe = {
    id: string;
    name: string;
    aliases?: string[];
    category: string;
    repeatable: boolean;
    output: {
      itemId: string;
      quantity: number;
      unit: string;
    };
    ingredients: {
      allOf?: Ingredient[];
      anyOf?: AlternativeIngredientGroup[];
    };
    confidence: "high" | "medium" | "disputed";
  };

recommended_resolver_pseudocode: |
  function expandRecipe(recipe, requestedQty, inventory):
      batches = ceil(requestedQty / recipe.output.quantity)

      requirements = {}

      for ingredient in recipe.ingredients.allOf:
          requirements[ingredient.itemId] += ingredient.quantity * batches

      for group in recipe.ingredients.anyOf:
          # Do NOT add every alternative.
          # Ask route optimizer which alternative is cheapest/nearest/available.
          chosen = chooseBestAlternative(group.alternatives)
          requirements[chosen.itemId] += chosen.quantity * batches

      for itemId in requirements:
          requirements[itemId] = max(
              0,
              requirements[itemId] - inventory.get(itemId, 0)
          )

      return requirements
